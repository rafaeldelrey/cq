#
# For a guide to configuration, visit https://qlty.sh/d/config
# Or for a full reference, visit https://qlty.sh/d/qlty-toml
config_version = "0"

# cq's default qlty config, written by `cq init` into a repo that has none. qlty init's
# "**/config/**" and "**/db/**" patterns are left out: they drop real production code.
exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/tests/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

# Python keyword-only arguments make 5–7 parameters common in clean code; 8 is where it starts to smell.
[smells.function_parameters]
threshold = 8  # qlty flags counts >= threshold

# Test code plays by different rules: asserts and fixture "credentials" are the point.
[[triage]]
match.rules = ["bandit:B101", "bandit:B106"]
match.file_patterns = ["**/test_*.py", "**/tests/**", "**/conftest.py"]
set.ignored = true

[[source]]
name = "default"
default = true


[[plugin]]
name = "bandit"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

# radarlint, radarlint-js and zizmor feed cq collectors: versions pinned so the
# nightly trend and the PR gate measure with the same rules.
[[plugin]]
name = "radarlint-python"
version = "2.0.0"
mode = "comment"

[[plugin]]
name = "radarlint-js"
version = "2.0.0"
mode = "comment"

[[plugin]]
name = "zizmor"
version = "1.16.3"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "ruff"
drivers = [
  "lint",
]

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"
