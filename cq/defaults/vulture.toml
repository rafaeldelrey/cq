# cq's default vulture config, used when the measured app has no [tool.vulture] of its own.
# Functions registered with a framework decorator are called by the framework, not by name.
[tool.vulture]
min_confidence = 60
ignore_decorators = [
    "@router.*",
    "@app.*",
    "@*.get",
    "@*.post",
    "@*.put",
    "@*.patch",
    "@*.delete",
    "@tool",
    "@field_validator",
    "@model_validator",
    "@validator",
    "@pytest.fixture",
]
ignore_names = ["model_config", "model_post_init", "lifespan", "cls"]
