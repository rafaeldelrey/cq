# Secrets-scanner config for code_quality's `secrets` collector (betterleaks reads gitleaks's format): gitleaks' own rules, plus allowlists for
# findings checked by hand and confirmed not to be secrets. Keep each entry narrow (a line pattern,
# never a whole file) so a real secret next to it is still caught. Changing this file invalidates
# the cached history scan (runs/_cache/), so the next run re-scans every commit.

[extend]
useDefault = true

[[allowlists]]
description = "Passing the Nightscout token from settings, not a literal (apps/agents_server/app/services/console.py, checked 2026-10-11)"
regexTarget = "line"
regexes = ['''settings\.ns_token''']

[[allowlists]]
description = "The fake AWS key in parallel_search's redaction test: AKIA + sequential letters (checked 2026-10-11)"
regexTarget = "match"
regexes = ['''AKIA[A-Z]*EFGHIJKLMNOP''']

[[allowlists]]
description = "Placeholder settings in the reflector guard test: evolution_api_url=\"http://evo\", evolution_api_key=\"key\" (apps/agents_server/tests/agents/test_reflector_guard.py, checked 2026-10-12; #251 and 26e988c merged)"
regexTarget = "line"
regexes = ['''evolution_api_url="http://evo", evolution_api_key="key"''']

[[allowlists]]
description = "Placeholder password \"pw\" in the public_address test, whose point is that it gets stripped (apps/agents_server/tests/core/test_integrations.py, checked 2026-10-14; #303)"
regexTarget = "line"
regexes = ['''public_address\("postgresql://han:pw@10\.0\.0\.202:5432/han\?sslmode=off"\)''']

[[allowlists]]
description = "The throwaway test container's URL in the run-records integration test's docstring, POSTGRES_PASSWORD=test (apps/agents_server/tests/integration/test_run_records_db.py, checked 2026-10-14; #303)"
regexTarget = "line"
regexes = ['''RUN_RECORDS_TEST_DB_URL=postgresql://postgres:test@localhost:55432/postgres''']
