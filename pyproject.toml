[project]
name = "cq"
version = "0.13.0"
description = "Code-quality snapshots of a repository, stored as history and reported as trends, plus a PR gate"
readme = "README.md"
requires-python = ">=3.12"
# Pinned: a snapshot is only comparable with the last one when the measuring tools are the same.
# Bumping one of these is a measurement change: say so in the changelog, and expect a step in the
# trend. The tools outside this environment are pinned in cq/config.py (PINS).
dependencies = [
    "radon==6.0.1",
    "vulture==2.16",
    "interrogate==1.7.0",
    "complexipy==8.0.1",
    "semgrep==1.180.0",
    "pip-audit==2.10.1",
    "deptry==0.25.1",
    "import-linter==2.15",
    # Not a measuring tool: PEP 440 versions and PEP 508 markers in requirements files.
    "packaging>=24",
]

[tool.uv]
# semgrep pins mcp==1.29.0 (CVE-2026-59951, fixed in 1.30). Only `semgrep mcp` imports it, and cq runs
# `semgrep scan`. It also pins OpenTelemetry ~=1.37 (CVE-2026-114603 in opentelemetry-api, fixed in
# 1.45.1): the family moves together, 1.45 with its contrib 0.66, or semgrep fails to start. Drop
# these once a semgrep release allows OpenTelemetry 1.45.
# `uv tool install` ignores these overrides, so they cover the lock, dev and CI.
override-dependencies = [
    "mcp>=1.30,<2",
    "opentelemetry-api>=1.45.1,<1.46",
    "opentelemetry-sdk>=1.45.1,<1.46",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<1.46",
    "opentelemetry-exporter-otlp-proto-common>=1.45.1,<1.46",
    "opentelemetry-proto>=1.45.1,<1.46",
    "opentelemetry-instrumentation>=0.66b1,<0.67",
    "opentelemetry-instrumentation-requests>=0.66b1,<0.67",
    "opentelemetry-instrumentation-threading>=0.66b1,<0.67",
    "opentelemetry-semantic-conventions>=0.66b1,<0.67",
    "opentelemetry-util-http>=0.66b1,<0.67",
]

[project.scripts]
cq = "cq.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-cov>=5", "ruff>=0.12", "pyright>=1.1.403"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cq"]

[tool.hatch.build.targets.wheel.force-include]
# Dot-files hatch would otherwise leave out of the wheel.
"cq/defaults/vale/.vale.ini" = "cq/defaults/vale/.vale.ini"

# ─── This project's own checks ───────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "BLE"]
ignore = [
    "S603", "S607",  # running the measuring tools as subprocesses is the whole job
    "E501",          # long lines: f-strings building report lines; ruff format handles code
    "RUF001", "RUF002", "RUF003",  # typographic ×, →, — in report text and docstrings are deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pyright]
include = ["cq", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cq"]

[tool.coverage.report]
fail_under = 85

[tool.deptry.per_rule_ignores]
# cq runs these as commands (`uv run <tool>` in its own environment), never imports them: they are
# dependencies so that an installed cq brings its measuring tools along.
DEP002 = ["vulture", "interrogate", "complexipy", "semgrep", "pip-audit", "deptry", "import-linter"]

[tool.cq]
name = "cq"
# Targets are detected: the pyproject at the root is one Python app (cq/), plus the repo target.

[tool.cq.gate]
mode = "warn"  # report-only for now (AGENTS.md: dogfood)
block = [
    "secrets:*",
    "aislop:ai-slop/*",
    "vale:Stubs",
    "semgrep:cq-*",
    "qlty:zizmor:*",
    "qlty:shellcheck:*",
    "qlty:hadolint:*",
    "qlty:osv-scanner:*",
    "smells:*",
    "pyscn:*",
    "ratchet:*",
    "docstrings:missing-docstring",
]
